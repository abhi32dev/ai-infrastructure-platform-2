services:
  redis:
    image: redis:7-alpine
    container_name: aegis-backpressure-redis
    ports:
      - "6380:6379"   # non-default host port so it can't collide with any other local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
