global:
  scrape_interval: 5s

scrape_configs:
  - job_name: aegis-rag-pipeline
    static_configs:
      # host.docker.internal resolves to the Docker host on macOS/Windows,
      # letting the containerized Prometheus scrape the FastAPI app
      # running directly on the host (uvicorn app:app --port 8000).
      - targets: ["host.docker.internal:8000"]
