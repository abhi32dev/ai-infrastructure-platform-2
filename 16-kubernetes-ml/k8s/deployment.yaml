apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  labels:
    app: model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: model-serving
          image: model-serving:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # host.docker.internal resolves to the Docker host from inside
            # a kind node's containers, letting the pod reach Ollama
            # running on the Mac host — same pattern as project 13's
            # Prometheus scrape config reaching the host-run FastAPI app.
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # readinessProbe: pulls a pod out of Service rotation the moment
          # its circuit breaker reports the downstream (Ollama) unhealthy —
          # the Kubernetes-native version of the CONDOR ALB/NLB
          # target-health-check pattern already on the resume.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          # livenessProbe: restarts the pod only if the PROCESS itself is
          # unresponsive (not merely "downstream is degraded" — that's the
          # readiness probe's job). Deliberately looser than readiness so a
          # transient downstream outage doesn't cause unnecessary restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: model-serving
spec:
  selector:
    app: model-serving
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
